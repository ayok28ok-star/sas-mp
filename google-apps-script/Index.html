      function esc(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function escJs(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/\\/g, '\\\\')
          .replace(/'/g, "\\'")
          .replace(/"/g, '\\"')
          .replace(/\r/g, '\\r')
          .replace(/\n/g, '\\n');
      }

      function formatIndoDate(dateStr) {
        try {
          var s = String(dateStr || '').trim();
          var m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
          var d = m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : new Date(s);
          if (isNaN(d.getTime())) return dateStr || '-';
          return new Intl.DateTimeFormat('id-ID', {
            weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
          }).format(d);
        } catch (e) {
          return dateStr || '-';
        }
      }

      function formatTimeNow() {
        return new Date().toLocaleTimeString('id-ID', {
          hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        });
      }

      function formatWAPhone(phone) {
        var cleaned = String(phone || '').replace(/\D/g, '');
        if (cleaned.startsWith('08')) return '62' + cleaned.slice(1);
        if (cleaned.startsWith('8')) return '62' + cleaned;
        if (!cleaned.startsWith('62') && cleaned.length > 5) return '62' + cleaned;
        return cleaned;
      }

      function buildWAMessage(tmplText, student, rec, notes) {
        var settings = state.settings || {};
        var tStr = (rec && rec.checkInTime) || (formatTimeNow() + ' WIB');
        var dStr = formatIndoDate((rec && rec.date) || todayISO());
        var sStr = rec && rec.status ? getStatusLabel(rec.status) : 'Hadir';
        return String(tmplText || '')
          .replace(/{nama_siswa}/g, student.name || '')
          .replace(/{kelas}/g, student.studentClass || '')
          .replace(/{nis}/g, student.nis || '')
          .replace(/{nisn}/g, student.nisn || '-')
          .replace(/{nama_ortu}/g, student.parentName || 'Bapak/Ibu Wali Murid')
          .replace(/{sekolah}/g, settings.schoolName || '')
          .replace(/{waktu}/g, tStr)
          .replace(/{tanggal}/g, dStr)
          .replace(/{status}/g, sStr)
          .replace(/{catatan}/g, notes || (rec && rec.notes) || 'Tidak ada catatan');
      }

      function showToast(msg, type) {
        var root = document.getElementById('toast-root');
        if (!root) return;
        var el = document.createElement('div');
        var color = type === 'error'
          ? 'bg-rose-600 text-white'
          : type === 'warning'
          ? 'bg-amber-600 text-white'
          : 'bg-slate-900 text-white';
        el.className = 'px-4 py-2.5 rounded-xl text-xs font-semibold shadow-lg transition-all ' + color;
        el.textContent = msg;
        root.appendChild(el);
        setTimeout(function () {
          el.style.opacity = '0';
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 250);
        }, 2800);
      }

      // Audio feedback
      var AudioFX = {
        play: function (freq, dur, type) {
          try {
            var Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return;
            var ctx = new Ctx();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = type || 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + dur);
          } catch (e) {}
        },
        success: function () { this.play(880, 0.14, 'sine'); setTimeout(function () { AudioFX.play(1174, 0.18, 'sine'); }, 110); },
        warning: function () { this.play(520, 0.18, 'triangle'); },
        error: function () { this.play(260, 0.28, 'sawtooth'); }
      };

      function applyHeadFaviconHref(href, mimeType) {
        var head = document.head || document.getElementsByTagName('head')[0];
        if (!head) return;
        var oldLinks = document.querySelectorAll('link[rel="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"]');
        oldLinks.forEach(function (el) {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        });
        if (!href) return;
        var l1 = document.createElement('link');
        l1.id = 'sas-favicon';
        l1.rel = 'icon';
        if (mimeType) l1.type = mimeType;
        l1.href = href;
        head.appendChild(l1);

        var l2 = document.createElement('link');
        l2.id = 'sas-shortcut-icon';
        l2.rel = 'shortcut icon';
        if (mimeType) l2.type = mimeType;
        l2.href = href;
        head.appendChild(l2);

        if (mimeType === 'image/png') {
          var l3 = document.createElement('link');
          l3.id = 'sas-apple-icon';
          l3.rel = 'apple-touch-icon';
          l3.href = href;
          head.appendChild(l3);
        }
      }

      var cachedDefaultSasIconPng = '';
      function generateDefaultSasIconPngDataUrl() {
        if (cachedDefaultSasIconPng) return cachedDefaultSasIconPng;
        try {
          var size = 192;
          var canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          var ctx = canvas.getContext('2d');
          if (!ctx) return '';

          // Emerald gradient rounded app icon tile
          var grad = ctx.createLinearGradient(0, 0, size, size);
          grad.addColorStop(0, '#059669');
          grad.addColorStop(1, '#047857');
          var r = 40;
          ctx.beginPath();
          ctx.moveTo(r, 0);
          ctx.lineTo(size - r, 0);
          ctx.quadraticCurveTo(size, 0, size, r);
          ctx.lineTo(size, size - r);
          ctx.quadraticCurveTo(size, size, size - r, size);
          ctx.lineTo(r, size);
          ctx.quadraticCurveTo(0, size, 0, size - r);
          ctx.lineTo(0, r);
          ctx.quadraticCurveTo(0, 0, r, 0);
          ctx.closePath();
          ctx.fillStyle = grad;
          ctx.fill();

          // White shield & SAS label
          ctx.strokeStyle = 'rgba(255,255,255,0.92)';
          ctx.lineWidth = 8;
          ctx.strokeRect(28, 28, size - 56, size - 56);

          ctx.fillStyle = '#ffffff';
          ctx.font = '800 54px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('SAS', size / 2, size / 2 - 8);

          ctx.font = '700 18px sans-serif';
          ctx.fillStyle = '#d1fae5';
          ctx.fillText('ABSENSI', size / 2, size / 2 + 36);

          cachedDefaultSasIconPng = canvas.toDataURL('image/png');
          return cachedDefaultSasIconPng;
        } catch (e) {
          return '';
        }
      }

      function renderFaviconPngFromLogo(logoUrl, callback) {
        var url = String(logoUrl || '').trim();
        if (!url) {
          if (callback) callback(generateDefaultSasIconPngDataUrl());
          return;
        }
        var img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function () {
          try {
            var size = 192;
            var canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            var ctx = canvas.getContext('2d');
            var radius = 36;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            var pad = 12;
            var maxDim = size - pad * 2;
            var ratio = Math.min(maxDim / img.width, maxDim / img.height);
            var w = img.width * ratio;
            var h = img.height * ratio;
            ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
            var pngUrl = canvas.toDataURL('image/png');
            if (callback) callback(pngUrl);
          } catch (e) {
            if (callback) callback(url.indexOf('data:image/png') === 0 ? url : generateDefaultSasIconPngDataUrl());
          }
        };
        img.onerror = function () {
          if (callback) callback(generateDefaultSasIconPngDataUrl());
        };
        img.src = url;
      }

      function syncFavicon(logoUrl) {
        var url = String(logoUrl || '').trim();
        if (!url) {
          var fallbackPng = generateDefaultSasIconPngDataUrl();
          if (state.settings) state.settings.faviconDataUrl = fallbackPng;
          if (fallbackPng) applyHeadFaviconHref(fallbackPng, 'image/png');
          return;
        }
        if (url.indexOf('data:image/svg+xml') === 0) {
          applyHeadFaviconHref(url, 'image/svg+xml');
        }
        renderFaviconPngFromLogo(url, function (pngUrl) {
          if (pngUrl) {
            if (state.settings) state.settings.faviconDataUrl = pngUrl;
            applyHeadFaviconHref(pngUrl, 'image/png');
          } else {
            applyHeadFaviconHref(url, '');
          }
        });
      }

      }

      // =========================================================================

      function gasCall(fnName, payload) {
        return new Promise(function (resolve, reject) {
          if (IS_GAS) {
            var runner = google.script.run
              .withSuccessHandler(function (res) { resolve(res); })
              .withFailureHandler(function (err) { reject(err); });
            if (payload !== undefined) {
              runner[fnName](payload);
            } else {
              runner[fnName]();
            }
          } else {
            // Fallback preview jika dibuka di luar Google Apps Script
            reject(new Error('Google Apps Script environment tidak terdeteksi. Jalankan melalui Web App Google Sheets.'));
          }
        });
      }

      function applyBootstrapData(data) {
        state.settings = data.settings;
        state.students = data.students || [];
        state.records = data.records || [];
        state.classes = data.classes || [];
        state.subjects = data.subjects || [];
        state.teachers = data.teachers || [];
        state.schedules = data.schedules || [];
        state.templates = data.templates || [];
        state.logs = data.logs || [];
        state.registeredUsers = data.registeredUsers || [];
        state.spreadsheetUrl = data.spreadsheetUrl || '';
        state.webAppUrl = data.webAppUrl || '';
        if (state.webAppUrl) {
          var head = document.head || document.getElementsByTagName('head')[0];
          if (head) {
            var manLink = document.getElementById('sas-manifest');
            if (!manLink) {
              manLink = document.createElement('link');
              manLink.id = 'sas-manifest';
              manLink.rel = 'manifest';
              head.appendChild(manLink);
            }
            var sep = state.webAppUrl.indexOf('?') === -1 ? '?' : '&';
            manLink.href = state.webAppUrl + sep + 'action=manifest';
          }
        }
        if (!state.scannerScheduleId && state.schedules.length) {
          state.scannerScheduleId = state.schedules[0].id;
        }
        if (!state.progressStudentId && state.students.length) {
          state.progressStudentId = state.students[0].id;
        }
        if (!state.progressStartDate) {
          var d = new Date();
          d.setDate(d.getDate() - 30);
          state.progressStartDate = toLocalISO(d);
        }
        syncFavicon(state.settings && state.settings.schoolLogo);
        if (state.autoInstallPending && !state.isInstalledStandalone) {
          state.autoInstallPending = false;
          setTimeout(function () {
            openInstallStoreModal();
          }, 250);
        }
      }

      function bootstrapApp() {
        state.loading = true;
        state.bootstrapError = '';
        syncFavicon('');
        render();

        try {
          var savedUser = safeStorageGet('sas_gas_auth_user');
          if (savedUser) state.authUser = JSON.parse(savedUser);
        } catch (e) {}

        var maybeOpenAutoInstall = function () {
          if (state.autoInstallPending && !state.isInstalledStandalone) {
            state.autoInstallPending = false;
            setTimeout(openInstallStoreModal, 200);
          }
        };

        if (IS_GAS) {
          gasCall('getBootstrapData')
            .then(function (data) {
              state.bootstrapError = '';
              applyBootstrapData(data);
              state.loading = false;
              render();
              maybeOpenAutoInstall();
            })
            .catch(function (err) {
              var msg = err && err.message ? err.message : String(err || 'Gagal memuat Spreadsheet');
              state.bootstrapError = msg;
              if (!state.settings) {
                applyBootstrapData(getFallbackDemoData());
              }
              state.loading = false;
              showToast('Gagal memuat Spreadsheet: ' + msg, 'error');
              render();
              maybeOpenAutoInstall();
            });
        } else {
          applyBootstrapData(getFallbackDemoData());
          state.loading = false;
          render();
          maybeOpenAutoInstall();
        }
      }

      function refreshFromSheets() {
        if (!IS_GAS) return;
        state.syncing = true;
        render();
        gasCall('getBootstrapData')
          .then(function (data) {
            applyBootstrapData(data);
            state.syncing = false;
            showToast('Data berhasil disinkronkan dari Google Spreadsheet.');
            render();
          })
          .catch(function (err) {
            state.syncing = false;
            showToast('Sinkronisasi gagal: ' + err.message, 'error');
            render();
          });
      }

        state.currentTab = tab;
        state.isThemeMenuOpen = false;

      // =========================================================================
      // 5. LOGIN & DAFTAR PENGGUNA BARU
      // =========================================================================
      function switchAuthMode(mode) {
        state.authMode = mode;
        state.loginError = '';
        state.loginSuccess = '';
        render();
      }

      function handleLoginSubmit(e) {
        e.preventDefault();
        var u = (document.getElementById('login-username-input').value || '').trim().toLowerCase();
        var p = (document.getElementById('login-password-input').value || '').trim();
        state.loginUsername = u;
        state.loginPassword = p;
        state.loginSuccess = '';

        if (!u || !p) {
          state.loginError = 'Mohon masukkan username dan password terlebih dahulu.';
          render();
          return;
        }

        // 1. Cek pengguna terdaftar di Sheet Pengguna / LocalStorage
        var matchedRegistered = (state.registeredUsers || []).find(function (usr) {
          return String(usr.username || '').toLowerCase() === u && String(usr.password || '') === p;
        });

        if (matchedRegistered) {
          state.authUser = {
            username: matchedRegistered.username,
            displayName: matchedRegistered.displayName,
            role: matchedRegistered.role || 'Guru Piket'
          };
        } else if (u === 'admin' && (p === '123' || p === 'admin123')) {
          state.authUser = { username: 'admin', displayName: 'Administrator Sekolah', role: 'Administrator' };
        } else if (u === 'guru' && (p === '123' || p === 'guru123')) {
          state.authUser = { username: 'guru', displayName: 'Siti Rahmawati, S.Pd.', role: 'Guru Piket' };
        } else {
          var matchedStudent = state.students.find(function (s) { return String(s.nis).toLowerCase() === u; });
          if (matchedStudent && (p === '123' || p === 'siswa123' || p === matchedStudent.nis)) {
            state.authUser = { username: matchedStudent.nis, displayName: matchedStudent.name, role: 'Siswa' };
            state.progressStudentId = matchedStudent.id;
          } else {
            state.loginError = 'Username atau password tidak sesuai. Silakan periksa kembali.';
            render();
            return;
          }
        }

        state.loginError = '';
        safeStorageSet('sas_gas_auth_user', JSON.stringify(state.authUser));
        render();
      }

      function handleRegisterSubmit(e) {
        e.preventDefault();
        if (state.isRegistering) return;
        var cleanName = (document.getElementById('reg-displayname-input').value || '').trim();
        var cleanUser = (document.getElementById('reg-username-input').value || '').trim().toLowerCase();
        var cleanRole = document.getElementById('reg-role-input').value || 'Guru Piket';
        var cleanPass = (document.getElementById('reg-password-input').value || '').trim();
        var cleanConfirm = (document.getElementById('reg-confirm-input').value || '').trim();

        state.regDisplayName = cleanName;
        state.regUsername = cleanUser;
        state.regRole = cleanRole;
        state.regPassword = cleanPass;
        state.regConfirmPassword = cleanConfirm;
        state.loginError = '';
        state.loginSuccess = '';

        if (!cleanName || !cleanUser || !cleanPass || !cleanConfirm) {
          state.loginError = 'Mohon lengkapi seluruh kolom pendaftaran pengguna baru.';
          render();
          return;
        }
        if (cleanUser.length < 3 || /\s/.test(cleanUser)) {
          state.loginError = 'Username minimal 3 karakter dan tidak boleh mengandung spasi.';
          render();
          return;
        }
        if (cleanPass.length < 4) {
          state.loginError = 'Password minimal 4 karakter demi keamanan akun.';
          render();
          return;
        }
        if (cleanPass !== cleanConfirm) {
          state.loginError = 'Konfirmasi password tidak cocok dengan password yang dimasukkan.';
          render();
          return;
        }

        var exists = (state.registeredUsers || []).some(function (u) {
          return String(u.username || '').toLowerCase() === cleanUser;
        });
        if (exists || cleanUser === 'admin' || cleanUser === 'guru') {
          state.loginError = 'Username "' + cleanUser + '" sudah terdaftar. Gunakan username lain.';
          render();
          return;
        }

        var newUser = {
          id: 'usr-' + Date.now(),
          username: cleanUser,
          password: cleanPass,
          displayName: cleanName,
          role: cleanRole,
          createdAt: new Date().toISOString()
        };

        var finishRegister = function (updatedList) {
          state.isRegistering = false;
          state.registeredUsers = updatedList;
          state.loginUsername = '';
          state.loginPassword = '';
          state.showPassword = false;
          state.regDisplayName = '';
          state.regUsername = '';
          state.regPassword = '';
          state.regConfirmPassword = '';
          state.authMode = 'login';
          state.loginError = '';
          state.loginSuccess = 'Pengguna "' + cleanName + '" (' + cleanRole + ') berhasil didaftarkan! Silakan masukkan username dan password Anda untuk masuk.';
          render();
        };

        if (IS_GAS) {
          state.isRegistering = true;
          render();
          gasCall('registerUser', newUser)
            .then(function (list) {
              finishRegister(list);
              showToast('Akun baru tersimpan di sheet Pengguna.');
            })
            .catch(function (err) {
              state.isRegistering = false;
              state.loginError = (err && err.message) || 'Gagal mendaftarkan pengguna.';
              render();
            });
        } else {
          var nextList = [newUser].concat(state.registeredUsers || []);
          safeStorageSet('sas_gas_registered_users', JSON.stringify(nextList));
          finishRegister(nextList);
        }
      }

      function initDashboardChart() {
        var canvas = document.getElementById('dashboard-trend-chart');
        if (!canvas || typeof Chart === 'undefined') return;
        if (trendChartInstance) { trendChartInstance.destroy(); trendChartInstance = null; }

        var labels = [];
        var tepatData = [];
        var lateData = [];
        var izinData = [];

        for (var i = 6; i >= 0; i--) {
          var d = new Date();
          d.setDate(d.getDate() - i);
          var iso = toLocalISO(d);
          var dayRecs = state.records.filter(function (r) { return r.date === iso; });
          labels.push(d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' }));
          tepatData.push(dayRecs.filter(function (r) { return r.status === 'hadir_tepat'; }).length);
          lateData.push(dayRecs.filter(function (r) { return r.status === 'terlambat'; }).length);
          izinData.push(dayRecs.filter(function (r) { return r.status === 'izin' || r.status === 'sakit'; }).length);
        }

        trendChartInstance = new Chart(canvas.getContext('2d'), {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [
              { label: 'Tepat Waktu', data: tepatData, backgroundColor: '#10b981', borderRadius: 4 },
              { label: 'Terlambat', data: lateData, backgroundColor: '#f59e0b', borderRadius: 4 },
              { label: 'Izin / Sakit', data: izinData, backgroundColor: '#6366f1', borderRadius: 4 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } }
          }
        });
      }

      // =========================================================================
      // 8. SCAN FOTO WAJAH BIOMETRIK + SIMULATOR + INTEGRASI SHEET ABSENSI
      // =========================================================================
      var GAS_FACE_MODEL_URLS = [
        'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model',
        'https://unpkg.com/@vladmandic/face-api@1.7.15/model',
        'https://cdn.jsdelivr.net/gh/vladmandic/face-api/model'
      ];
      var GAS_FACE_SCRIPT_URLS = [
        'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js',
        'https://unpkg.com/@vladmandic/face-api@1.7.15/dist/face-api.js'
      ];
      var gasCpuFallbackApplied = false;

      function ensureGasCpuFallback() {
        if (gasCpuFallbackApplied) return Promise.resolve(false);
        try {
          if (typeof faceapi !== 'undefined' && faceapi.tf && typeof faceapi.tf.setBackend === 'function') {
            return Promise.resolve(faceapi.tf.setBackend('cpu')).then(function () {
              return typeof faceapi.tf.ready === 'function' ? faceapi.tf.ready() : undefined;
            }).then(function () {
              gasCpuFallbackApplied = true;
              return true;
            }).catch(function () {
              return false;
            });
          }
        } catch (e) {}
        return Promise.resolve(false);
      }

      function ensureFaceApiLoaded() {
        if (typeof faceapi !== 'undefined') return Promise.resolve();
        return new Promise(function (resolve, reject) {
          var resolved = false;
          var done = function (err) {
            if (resolved) return;
            resolved = true;
            if (err) reject(err);
            else resolve();
          };
          var loadScriptFromList = function (idx) {
            if (typeof faceapi !== 'undefined') { done(); return; }
            if (idx >= GAS_FACE_SCRIPT_URLS.length) {
              done(new Error('Gagal mengunduh pustaka deteksi wajah dari CDN. Periksa koneksi internet Anda.'));
              return;
            }
            var sid = 'sas-faceapi-fallback-' + idx;
            if (document.getElementById(sid)) {
              loadScriptFromList(idx + 1);
              return;
            }
            var s = document.createElement('script');
            s.id = sid;
            s.src = GAS_FACE_SCRIPT_URLS[idx];
            s.async = true;
            s.onload = function () {
              if (typeof faceapi !== 'undefined') done();
              else loadScriptFromList(idx + 1);
            };
            s.onerror = function () {
              loadScriptFromList(idx + 1);
            };
            document.head.appendChild(s);
          };

          var existing = document.querySelector('script[src*="face-api"]');
          if (!existing) {
            loadScriptFromList(0);
            return;
          }
          existing.addEventListener('load', function () {
            if (typeof faceapi !== 'undefined') done();
            else loadScriptFromList(0);
          });
          existing.addEventListener('error', function () { loadScriptFromList(0); });

          var tries = 0;
          var timer = setInterval(function () {
            if (resolved) { clearInterval(timer); return; }
            tries++;
            if (typeof faceapi !== 'undefined') {
              clearInterval(timer);
              done();
              return;
            }
            if (tries === 25) {
              loadScriptFromList(0);
            }
            if (tries > 65) {
              clearInterval(timer);
              done(new Error('Pustaka deteksi wajah (face-api) belum tersedia. Pastikan koneksi internet aktif lalu coba lagi.'));
            }
          }, 150);
        });
      }

      function loadGasFaceModels() {
        if (state.modelsLoaded) return Promise.resolve();
        if (faceModelLoadPromise) return faceModelLoadPromise;
        state.modelsLoading = true;
        state.modelError = '';

        var tryLoadAt = function (idx) {
          if (idx >= GAS_FACE_MODEL_URLS.length) {
            return Promise.reject(new Error('Semua CDN model wajah gagal dimuat.'));
          }
          var url = GAS_FACE_MODEL_URLS[idx];
          return Promise.all([
            faceapi.nets.tinyFaceDetector.loadFromUri(url),
            faceapi.nets.faceLandmark68TinyNet.loadFromUri(url),
            faceapi.nets.faceRecognitionNet.loadFromUri(url)
          ]).catch(function () {
            return tryLoadAt(idx + 1);
          });
        };

        faceModelLoadPromise = ensureFaceApiLoaded().then(function () {
          return tryLoadAt(0);
        }).then(function () {
          state.modelsLoaded = true;
          state.modelsLoading = false;
        }).catch(function (err) {
          faceModelLoadPromise = null;
          state.modelsLoading = false;
          state.modelError = 'Gagal memuat model deteksi wajah (' + (err && err.message ? err.message : err) + ').';
          throw err;
        });
        return faceModelLoadPromise;
      }

      function compressGasFaceThumbnail(source, box, targetSize) {
        targetSize = targetSize || 160;
        var srcW = source.videoWidth || source.naturalWidth || source.width || 0;
        var srcH = source.videoHeight || source.naturalHeight || source.height || 0;
        if (!srcW || !srcH) return '';

        var sx = 0, sy = 0, sSize = Math.min(srcW, srcH);
        if (box && box.width > 10 && box.height > 10) {
          var cx = box.x + box.width / 2;
          var cy = box.y + box.height / 2;
          var padded = Math.max(box.width, box.height) * 1.45;
          sSize = Math.min(Math.max(padded, 64), Math.min(srcW, srcH));
          sx = Math.max(0, Math.min(srcW - sSize, cx - sSize / 2));
          sy = Math.max(0, Math.min(srcH - sSize, cy - sSize / 2));
        } else {
          sx = (srcW - sSize) / 2;
          sy = (srcH - sSize) / 2;
        }

        var c = document.createElement('canvas');
        c.width = targetSize;
        c.height = targetSize;
        var ctx = c.getContext('2d');
        if (!ctx) return '';
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, targetSize, targetSize);
        ctx.drawImage(source, sx, sy, sSize, sSize, 0, 0, targetSize, targetSize);
        return c.toDataURL('image/jpeg', 0.8);
      }

      function captureGasVideoFrameCanvas(video) {
        if (!video || !video.videoWidth || !video.videoHeight) return null;
        var vw = video.videoWidth;
        var vh = video.videoHeight;
        var maxDim = 960;
        var ratio = (vw > maxDim || vh > maxDim) ? Math.min(maxDim / vw, maxDim / vh) : 1;
        var canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(vw * ratio));
        canvas.height = Math.max(1, Math.round(vh * ratio));
        var ctx = canvas.getContext('2d');
        if (!ctx) return null;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        return canvas;
      }

      function normalizeFaceInputSource(inputEl) {
        if (inputEl instanceof HTMLImageElement) {
          var nw = inputEl.naturalWidth || inputEl.width || 0;
          var nh = inputEl.naturalHeight || inputEl.height || 0;
          var maxDim = 960;
          if (nw > maxDim || nh > maxDim) {
            var ratio = Math.min(maxDim / nw, maxDim / nh);
            var tw = Math.max(1, Math.round(nw * ratio));
            var th = Math.max(1, Math.round(nh * ratio));
            var scaledCanvas = document.createElement('canvas');
            scaledCanvas.width = tw;
            scaledCanvas.height = th;
            var sctx = scaledCanvas.getContext('2d');
            if (sctx) {
              sctx.drawImage(inputEl, 0, 0, tw, th);
              return scaledCanvas;
            }
          }
        }
        return inputEl;
      }

      function detectGasSingleFace(inputEl) {
        var isLiveVideo = (typeof HTMLVideoElement !== 'undefined') && (inputEl instanceof HTMLVideoElement);
        return loadGasFaceModels().then(function () {
          var normalized = normalizeFaceInputSource(inputEl);
          var runPass = function (inputSize, scoreThreshold) {
            var opts = new faceapi.TinyFaceDetectorOptions({ inputSize: inputSize, scoreThreshold: scoreThreshold });
            return faceapi.detectAllFaces(normalized, opts).withFaceLandmarks(true).withFaceDescriptors();
          };
          return runPass(320, 0.42).then(function (detections) {
            if ((!detections || detections.length === 0) && !isLiveVideo) {
              return runPass(416, 0.28);
            }
            return detections;
          }).catch(function (err) {
            return ensureGasCpuFallback().then(function (switched) {
              if (!switched) throw err;
              return runPass(320, 0.4).then(function (detections) {
                if ((!detections || detections.length === 0) && !isLiveVideo) {
                  return runPass(416, 0.28);
                }
                return detections;
              });
            });
          }).then(function (detections) {
            return { detections: detections, source: normalized };
          });
        }).then(function (res) {
          var detections = res.detections;
          var source = res.source;
          if (!detections || detections.length === 0) return null;
          var primary = detections.reduce(function (best, cur) {
            var ba = best.detection.box.width * best.detection.box.height;
            var ca = cur.detection.box.width * cur.detection.box.height;
            return ca > ba ? cur : best;
          });
          var rb = primary.detection.box;
          var box = { x: rb.x, y: rb.y, width: rb.width, height: rb.height };
          var landmarks = primary.landmarks.positions.map(function (pt) { return { x: pt.x, y: pt.y }; });
          var descriptor = Array.from(primary.descriptor).map(function (v) { return Number(v.toFixed(4)); });
          var facePhoto = compressGasFaceThumbnail(source, box, 160);
          return { box: box, landmarks: landmarks, descriptor: descriptor, score: primary.detection.score, facePhoto: facePhoto };
        });
      }

      function euclideanDist(a, b) {
        if (!a || !b || a.length !== b.length) return Infinity;
        var sum = 0;
        for (var i = 0; i < a.length; i++) {
          var d = a[i] - b[i];
          sum += d * d;
        }
        return Math.sqrt(sum);
      }

      function findBestGasFaceMatch(descriptor, threshold) {
        threshold = threshold || 0.52;
        var bestStudent = null;
        var bestDist = Infinity;
        for (var i = 0; i < state.students.length; i++) {
          var st = state.students[i];
          if (!Array.isArray(st.faceDescriptor) || st.faceDescriptor.length !== 128) continue;
          var dist = euclideanDist(descriptor, st.faceDescriptor);
          if (dist < bestDist) {
            bestDist = dist;
            bestStudent = st;
          }
        }
        if (!bestStudent || bestDist > threshold) return null;
        var pct = Math.max(55, Math.min(99, Math.round((1 - bestDist / 0.85) * 100)));
        return { student: bestStudent, distance: Number(bestDist.toFixed(4)), confidencePct: pct };
      }

      function analyzeGasFrameLighting(source) {
        if (typeof document === 'undefined' || !source) return null;
        if (typeof HTMLVideoElement !== 'undefined' && source instanceof HTMLVideoElement) {
          if (source.readyState < 2 || !source.videoWidth || !source.videoHeight) return null;
        } else if (typeof HTMLImageElement !== 'undefined' && source instanceof HTMLImageElement) {
          if (!source.naturalWidth && !source.width) return null;
        } else if (!source.width || !source.height) {
          return null;
        }

        var size = 48;
        if (!gasLightingSampleCanvas) {
          gasLightingSampleCanvas = document.createElement('canvas');
          gasLightingSampleCanvas.width = size;
          gasLightingSampleCanvas.height = size;
          gasLightingSampleCtx = gasLightingSampleCanvas.getContext('2d', { willReadFrequently: true });
        }
        var ctx = gasLightingSampleCtx;
        if (!ctx) return null;

        try {
          ctx.drawImage(source, 0, 0, size, size);
          var imgData = ctx.getImageData(0, 0, size, size).data;
          var totalLuma = 0;
          var centerLuma = 0;
          var centerCount = 0;
          var totalPixels = size * size;
          var minC = Math.floor(size * 0.25);
          var maxC = Math.ceil(size * 0.75);

          for (var y = 0; y < size; y++) {
            for (var x = 0; x < size; x++) {
              var idx = (y * size + x) * 4;
              var luma = 0.299 * imgData[idx] + 0.587 * imgData[idx + 1] + 0.114 * imgData[idx + 2];
              totalLuma += luma;
              if (x >= minC && x < maxC && y >= minC && y < maxC) {
                centerLuma += luma;
                centerCount++;
              }
            }
          }

          var overallBrightness = totalLuma / totalPixels;
          var centerBrightness = centerCount > 0 ? centerLuma / centerCount : overallBrightness;
          var brightness = Math.round(centerBrightness * 0.65 + overallBrightness * 0.35);

          if (brightness < 55 || (centerBrightness < 50 && overallBrightness < 70)) {
            return {
              level: 'dark',
              brightness: brightness,
              centerBrightness: Math.round(centerBrightness),
              scorePct: Math.max(5, Math.min(34, Math.round((brightness / 55) * 34))),
              label: 'Terlalu Gelap',
              guidance: 'Kondisi pencahayaan terlalu gelap. Pindah ke tempat lebih terang atau hadapkan wajah ke sumber cahaya.'
            };
          }
          if (brightness < 90) {
            return {
              level: 'dim',
              brightness: brightness,
              centerBrightness: Math.round(centerBrightness),
              scorePct: Math.max(35, Math.min(68, Math.round(35 + ((brightness - 55) / 35) * 33))),
              label: 'Agak Redup',
              guidance: 'Cahaya agak redup — tambahkan pencahayaan agar deteksi wajah lebih cepat dan akurat.'
            };
          }
          if (brightness <= 215) {
            return {
              level: 'good',
              brightness: brightness,
              centerBrightness: Math.round(centerBrightness),
              scorePct: Math.max(72, Math.min(100, Math.round(100 - Math.min(28, Math.abs(brightness - 145) * 0.35)))),
              label: 'Cahaya Baik',
              guidance: 'Pencahayaan ideal dan merata untuk pemindaian wajah.'
            };
          }
          return {
            level: 'bright',
            brightness: brightness,
            centerBrightness: Math.round(centerBrightness),
            scorePct: Math.max(40, Math.min(72, Math.round(72 - ((brightness - 215) / 40) * 32))),
            label: 'Terlalu Silau',
            guidance: 'Cahaya terlalu terang atau silau. Hindari sorotan lampu langsung di belakang/depan kamera.'
          };
        } catch (e) {
          return null;
        }
      }

        if (barEl) {

          barEl.className = 'h-full rounded-full transition-all duration-300 ' + (

          );
        }

          else darkTorchBtnEl.classList.add('hidden');
        }

              ? 'bg-amber-50 border-amber-200 text-amber-800'
              : 'bg-emerald-50 border-emerald-200 text-emerald-800'
          );
        }
        if (stripMoonEl) stripMoonEl.className = lvl === 'dark' ? 'inline-flex items-center text-rose-600 shrink-0' : 'hidden';
        if (stripSunEl) stripSunEl.className = lvl === 'dark' ? 'hidden' : ('inline-flex items-center shrink-0 ' + (lvl === 'good' ? 'text-emerald-600' : 'text-amber-600'));

      function startGasLightingMonitor() {
        if (lightingMonitorTimer) {
          clearInterval(lightingMonitorTimer);
          lightingMonitorTimer = null;
        }
        var measure = function () {
          var v = document.getElementById('face-video');
          if (!v || !faceStream) return;
          var res = analyzeGasFrameLighting(v);
          if (res) {
            var prev = state.lightingQuality;
            if (!prev || prev.level !== res.level || Math.abs(prev.scorePct - res.scorePct) >= 2) {
              state.lightingQuality = res;
              refreshGasLightingHud();
            }
          }
        };
        measure();
        lightingMonitorTimer = setInterval(measure, 350);
      }

      function fillRoundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
        ctx.fill();
      }

      function drawGasFaceOverlay(canvas, video, detected, label, matched) {
        var vw = video.videoWidth;
        var vh = video.videoHeight;
        if (!vw || !vh) return;
        if (canvas.width !== vw || canvas.height !== vh) {
          canvas.width = vw;
          canvas.height = vh;
        }
        var ctx = canvas.getContext('2d');
        if (!ctx) return;
        ctx.clearRect(0, 0, vw, vh);
        if (!detected) return;

        var b = detected.box;
        ctx.strokeStyle = matched ? '#10b981' : '#f59e0b';
        ctx.lineWidth = Math.max(2, Math.round(vw / 240));
        ctx.strokeRect(b.x, b.y, b.width, b.height);

        var corner = Math.min(22, b.width * 0.22, b.height * 0.22);
        ctx.lineWidth = Math.max(4, Math.round(vw / 150));
        ctx.beginPath();
        ctx.moveTo(b.x, b.y + corner); ctx.lineTo(b.x, b.y); ctx.lineTo(b.x + corner, b.y);
        ctx.moveTo(b.x + b.width - corner, b.y); ctx.lineTo(b.x + b.width, b.y); ctx.lineTo(b.x + b.width, b.y + corner);
        ctx.moveTo(b.x, b.y + b.height - corner); ctx.lineTo(b.x, b.y + b.height); ctx.lineTo(b.x + corner, b.y + b.height);
        ctx.moveTo(b.x + b.width - corner, b.y + b.height); ctx.lineTo(b.x + b.width, b.y + b.height); ctx.lineTo(b.x + b.width, b.y + b.height - corner);
        ctx.stroke();

        ctx.fillStyle = matched ? 'rgba(52, 211, 153, 0.85)' : 'rgba(251, 191, 36, 0.85)';
        for (var i = 0; i < detected.landmarks.length; i++) {
          var pt = detected.landmarks[i];
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 1.8, 0, Math.PI * 2);
          ctx.fill();
        }

        if (label) {
          var fs = Math.max(13, Math.round(vw / 32));
          ctx.font = 'bold ' + fs + 'px sans-serif';
          var padX = 10;
          var tw = ctx.measureText(label).width;
          var bw = tw + padX * 2;
          var bh = fs + 12;
          var lx = Math.max(4, Math.min(vw - bw - 4, b.x));
          var ly = Math.max(4, b.y - bh - 6);
          ctx.fillStyle = matched ? 'rgba(5, 150, 105, 0.92)' : 'rgba(217, 119, 6, 0.92)';
          fillRoundRect(ctx, lx, ly, bw, bh, 8);
          ctx.fillStyle = '#ffffff';
          ctx.fillText(label, lx + padX, ly + fs + 4);
        }
      }

      function findMatchingAttendanceRecord(studentId, dateStr) {
        if (state.scannerScope === 'mapel' && state.scannerScheduleId && state.scannerType !== 'pulang') {
          return state.records.find(function (r) {
            return r.studentId === studentId && r.date === dateStr && r.scheduleId === state.scannerScheduleId;
          });
        }
        return state.records.find(function (r) {
          return r.studentId === studentId && r.date === dateStr && (!r.scheduleId || r.attendanceScope === 'harian');
        }) || state.records.find(function (r) {
          return r.studentId === studentId && r.date === dateStr;
        });
      }

      function recordAttendanceForStudent(student, options) {
        if (!student || scanCooldown) return;
        options = options || {};
        var isFromAuto = !!options.fromAutoScan;
        var now = new Date();
        var dStr = todayISO();
        var tStr = formatTimeNow();
        var existing = findMatchingAttendanceRecord(student.id, dStr);

        if (state.scannerType === 'pulang') {
          if (!existing) {
            if (isFromAuto) {
              var nowTs = Date.now();
              if (autoScanNoticeCooldown[student.id] && nowTs - autoScanNoticeCooldown[student.id] < 6000) return;
              autoScanNoticeCooldown[student.id] = nowTs;
            }
            AudioFX.warning();
            state.scannerMessage = student.name + ' belum melakukan absen masuk hari ini.';
            refreshScannerDynamicPanels();
            return;
          }
          scanCooldown = true;
          setTimeout(function () { scanCooldown = false; }, 2200);
          var tmplMapPulang = {};
          state.templates.forEach(function (t) { tmplMapPulang[t.type] = t.text; });
          var updatedRec = Object.assign({}, existing, {
            checkOutTime: tStr,
            whatsappNotification: {
              sent: true,
              sentAt: dStr + ' ' + tStr,
              status: 'terkirim',
              phone: student.parentPhone,
              message: 'Notifikasi kepulangan ' + student.name
            }
          });
          var pulMsg = buildWAMessage(tmplMapPulang.pulang || 'Ananda {nama_siswa} telah pulang pukul {waktu}.', student, updatedRec);
          AudioFX.success();
          persistAttendanceRecord(updatedRec, student, pulMsg, options);
          return;
        }

        if (existing && existing.checkInTime) {
          if (isFromAuto) {
            var lastTs = autoScanNoticeCooldown[student.id] || 0;
            if (Date.now() - lastTs < 8000) return;
            autoScanNoticeCooldown[student.id] = Date.now();
          }
          AudioFX.warning();
          state.scannerMessage = student.name + ' sudah melakukan absen masuk ' + (state.scannerScope === 'mapel' ? 'pada sesi mapel ini ' : 'hari ini ') + 'pukul ' + existing.checkInTime + '.';
          refreshScannerDynamicPanels();
          return;
        }

        scanCooldown = true;
        setTimeout(function () { scanCooldown = false; }, 2200);

        var tmplMap = {};
        state.templates.forEach(function (t) { tmplMap[t.type] = t.text; });

        var tol = (state.settings && state.settings.checkInLateTolerance) || '07:15';
        var parts = tol.split(':').map(Number);
        var curMin = now.getHours() * 60 + now.getMinutes();
        var tolMin = (parts[0] || 7) * 60 + (parts[1] || 15);
        var isLate = curMin > tolMin;
        var lateMinutes = isLate ? (curMin - tolMin) : 0;
        var st = isLate ? 'terlambat' : 'hadir_tepat';

        var sch = state.scannerScope === 'mapel'
          ? state.schedules.find(function (x) { return x.id === state.scannerScheduleId; })
          : null;

        var faceSuffix = options.confidencePct ? (' · Verifikasi Wajah ' + options.confidencePct + '%') : '';
        var notes = sch
          ? 'Sesi ' + sch.subjectName + ' (' + sch.className + ' - ' + sch.teacherName + ')' + faceSuffix
          : (isLate ? 'Tiba setelah batas ' + tol + faceSuffix : 'Tepat waktu' + faceSuffix);

        var newRec = {
          id: 'rec-' + dStr + '-' + student.id + (sch ? '-' + sch.id : ''),
          studentId: student.id,
          studentName: student.name,
          studentNis: student.nis,
          studentClass: student.studentClass,
          parentPhone: student.parentPhone,
          parentName: student.parentName,
          date: dStr,
          checkInTime: tStr,
          checkOutTime: '',
          status: st,
          type: 'masuk',
          attendanceScope: state.scannerScope,
          subjectId: sch ? sch.subjectId : '',
          subjectName: sch ? sch.subjectName : '',
          scheduleId: sch ? sch.id : '',
          notes: notes,
          lateMinutes: lateMinutes,
          whatsappNotification: {
            sent: !!(state.settings && state.settings.autoSendWhatsApp),
            sentAt: dStr + ' ' + tStr,
            status: (state.settings && state.settings.autoSendWhatsApp) ? 'terkirim' : 'pending',
            phone: student.parentPhone,
            message: ''
          }
        };

        var tmplKey = isLate ? 'masuk_terlambat' : 'masuk_tepat';
        var waMsg = buildWAMessage(tmplMap[tmplKey] || 'Ananda {nama_siswa} hadir status {status} pukul {waktu}.', student, newRec, notes);
        newRec.whatsappNotification.message = waMsg;

        if (isLate) AudioFX.warning();
        else AudioFX.success();
        if (!isLate && typeof confetti === 'function') {
          confetti({ particleCount: 55, spread: 60, origin: { y: 0.7 } });
        }
        persistAttendanceRecord(newRec, student, waMsg, options);
      }

      function processManualStudentById(studentId) {
        var student = state.students.find(function (s) { return s.id === studentId; });
        if (!student) return;
        recordAttendanceForStudent(student);
      }

      function processManualStudentScan(codeText) {
        var trimmed = String(codeText || '').trim();
        if (!trimmed) return;
        var student = state.students.find(function (s) {
          return s.nis === trimmed || s.nisn === trimmed || s.name.toLowerCase() === trimmed.toLowerCase() || s.qrCodeData === trimmed;
        });
        if (!student) {
          AudioFX.error();
          state.scannerMessage = 'NIS / Nama "' + trimmed + '" tidak terdaftar di sheet Siswa.';
          refreshScannerDynamicPanels();
          return;
        }
        recordAttendanceForStudent(student);
      }

      function handleGasDetectedFace(detected, photoLighting) {
        if (!detected) {
          AudioFX.error();
          if (photoLighting && photoLighting.level === 'dark') {
            state.scannerMessage = 'Wajah tidak terdeteksi karena pencahayaan terlalu gelap (Kualitas Cahaya ' + photoLighting.scorePct + '%). Pindah ke area lebih terang atau nyalakan senter HP lalu coba lagi.';
          } else if (photoLighting && photoLighting.level === 'bright') {
            state.scannerMessage = 'Wajah tidak terdeteksi karena pencahayaan terlalu silau (' + photoLighting.scorePct + '%). Hindari sorotan lampu langsung dan coba lagi.';
          } else {
            state.scannerMessage = 'Wajah tidak terdeteksi pada foto. Pastikan pencahayaan cukup, wajah menghadap kamera, dan tidak buram.';
          }
          refreshScannerDynamicPanels();
          return;
        }
        var match = findBestGasFaceMatch(detected.descriptor, 0.52);
        if (match) {
          state.pendingEnrollFace = null;
          recordAttendanceForStudent(match.student, {
            confidencePct: match.confidencePct,
            capturedPhoto: detected.facePhoto
          });
        } else {
          AudioFX.warning();
          var enrolledCount = state.students.filter(function (s) {
            return Array.isArray(s.faceDescriptor) && s.faceDescriptor.length === 128;
          }).length;
          var defTarget = (state.students.find(function (s) {
            return !Array.isArray(s.faceDescriptor) || s.faceDescriptor.length !== 128;
          }) || state.students[0] || {}).id || '';
          state.pendingEnrollFace = {
            facePhoto: detected.facePhoto,
            descriptor: detected.descriptor,
            targetStudentId: defTarget
          };
          state.scannerMessage = enrolledCount === 0
            ? 'Wajah terdeteksi! Belum ada foto wajah siswa terdaftar — pilih nama siswa di bawah untuk mendaftarkan wajah & langsung absen.'
            : 'Wajah terdeteksi, namun belum cocok dengan data wajah siswa terdaftar. Anda dapat mendaftarkan wajah ini ke siswa di bawah.';
          refreshScannerDynamicPanels();
        }
      }

      function quickEnrollPendingFace() {
        if (!state.pendingEnrollFace || !state.pendingEnrollFace.targetStudentId) return;
        var st = state.students.find(function (x) { return x.id === state.pendingEnrollFace.targetStudentId; });
        if (!st) return;

        var updated = Object.assign({}, st, {
          facePhoto: state.pendingEnrollFace.facePhoto,
          faceDescriptor: state.pendingEnrollFace.descriptor
        });
        var sIdx = state.students.findIndex(function (x) { return x.id === updated.id; });
        if (sIdx >= 0) state.students[sIdx] = updated;

        state.pendingEnrollFace = null;
        state.scannerMessage = '';

        if (IS_GAS) {
          gasCall('saveStudent', updated).then(function (list) {
            state.students = list;
            showToast('Foto wajah ' + updated.name + ' disimpan ke Sheet Siswa.');
            refreshScannerDynamicPanels();
          }).catch(function (err) {
            showToast('Gagal simpan wajah ke Sheet: ' + err.message, 'error');
          });
        } else {
          showToast('Foto wajah ' + updated.name + ' didaftarkan (mode pratinjau).');
        }

        recordAttendanceForStudent(updated, { confidencePct: 99, capturedPhoto: updated.facePhoto });
      }

      function persistAttendanceRecord(rec, student, waMsg, options) {
        options = options || {};
        state.scannerMessage = '';
        state.lastScanned = {
          student: student,
          record: rec,
          message: waMsg,
          confidencePct: options.confidencePct,
          capturedPhoto: options.capturedPhoto || student.facePhoto
        };

        var idx = state.records.findIndex(function (r) { return r.id === rec.id; });
        if (idx >= 0) state.records[idx] = rec;
        else state.records.unshift(rec);
        refreshScannerDynamicPanels();

        if (IS_GAS) {
          gasCall('recordAttendance', rec)
            .then(function (res) {
              if (res && res.records) state.records = res.records;
              if (res && res.logs) state.logs = res.logs;
              showToast('Presensi ' + student.name + ' tersimpan ke Google Sheets!');
              refreshScannerDynamicPanels();
            })
            .catch(function (err) {
              showToast('Gagal menyimpan ke Sheet: ' + err.message, 'error');
            });
        }
      }

      function scheduleGasFaceFrame() {
        if (!faceStream) return;
        faceDetectTimer = setTimeout(function () {
          var video = document.getElementById('face-video');
          var canvas = document.getElementById('face-overlay');
          if (!faceStream) return;
          if (video && canvas && video.readyState >= 2 && video.videoWidth > 0 && !isDetectingFaceFrame) {
            isDetectingFaceFrame = true;
            detectGasSingleFace(video).then(function (detected) {
              if (!faceStream) return;
              var curCanvas = document.getElementById('face-overlay') || canvas;
              var curVideo = document.getElementById('face-video') || video;
              var statusEl = document.getElementById('face-live-status');
              if (detected) {
                var match = findBestGasFaceMatch(detected.descriptor, 0.52);
                if (match) {
                  drawGasFaceOverlay(curCanvas, curVideo, detected, match.student.name.split(' ')[0] + ' (' + match.confidencePct + '%)', true);
                  state.liveStatusText = 'Wajah cocok: ' + match.student.name + ' (' + match.confidencePct + '%)';
                  if (statusEl) statusEl.textContent = state.liveStatusText;
                  if (state.autoScanEnabled && !scanCooldown) {
                    recordAttendanceForStudent(match.student, {
                      confidencePct: match.confidencePct,
                      capturedPhoto: detected.facePhoto,
                      fromAutoScan: true
                    });
                  }
                } else {
                  drawGasFaceOverlay(curCanvas, curVideo, detected, 'Wajah Belum Terdaftar', false);
                  state.liveStatusText = 'Wajah terdeteksi — belum terdaftar di database';
                  if (statusEl) statusEl.textContent = state.liveStatusText;
                }
              } else {
                drawGasFaceOverlay(curCanvas, curVideo, null);
                state.liveStatusText = 'Arahkan wajah siswa ke dalam bingkai kamera...';
                if (statusEl) statusEl.textContent = state.liveStatusText;
              }
            }).catch(function () {}).finally(function () {
              isDetectingFaceFrame = false;
              if (faceStream) scheduleGasFaceFrame();
            });
          } else {
            if (faceStream) scheduleGasFaceFrame();
          }
        }, 550);
      }

      function isGasCameraPermissionError(err) {
        var name = err && err.name ? String(err.name) : '';
        var msg = err && err.message ? String(err.message) : String(err || '');
        var combined = (name + ' ' + msg).toLowerCase();
        return (
          combined.indexOf('notallowederror') !== -1 ||
          combined.indexOf('permissiondeniederror') !== -1 ||
          combined.indexOf('permission denied') !== -1 ||
          combined.indexOf('permission dismissed') !== -1 ||
          combined.indexOf('denied') !== -1 ||
          combined.indexOf('securityerror') !== -1
        );
      }

      function startCameraScanner(facingOverride) {
        var targetFacing = facingOverride || state.cameraFacing || 'user';
        state.cameraFacing = targetFacing;
        state.cameraError = '';
        state.cameraPermissionDenied = false;
        state.scannerMessage = '';
        state.hasTorch = false;
        state.isTorchOn = false;
        state.liveStatusText = 'Membuka kamera perangkat...';

        if (typeof navigator === 'undefined' || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          state.cameraError = 'Kamera langsung tidak tersedia pada browser ini. Gunakan tombol "Kamera Foto HP" atau "Pilih dari Galeri" di bawah.';
          render();
          return;
        }

        // Clean up active tracks/timers synchronously without calling render() before getUserMedia,
        // preserving user-activation gesture on iOS Safari & Chrome Mobile.
        if (faceDetectTimer) { clearTimeout(faceDetectTimer); faceDetectTimer = null; }
        if (lightingMonitorTimer) { clearInterval(lightingMonitorTimer); lightingMonitorTimer = null; }
        if (faceStream) {
          try { faceStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
          faceStream = null;
        }

        // 1. Request getUserMedia IMMEDIATELY inside user gesture; do NOT retry if permission denied
        navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: targetFacing }, width: { ideal: 1280 }, height: { ideal: 960 } },
          audio: false
        }).catch(function (firstErr) {
          if (isGasCameraPermissionError(firstErr)) return Promise.reject(firstErr);
          return navigator.mediaDevices.getUserMedia({
            video: { facingMode: targetFacing },
            audio: false
          });
        }).catch(function (secondErr) {
          if (isGasCameraPermissionError(secondErr)) return Promise.reject(secondErr);
          return navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        }).then(function (stream) {
          faceStream = stream;
          state.cameraActive = true;
          state.cameraPermissionDenied = false;
          try {
            var track = stream.getVideoTracks()[0];
            var caps = track && track.getCapabilities ? track.getCapabilities() : null;
            if (caps && caps.torch) state.hasTorch = true;
          } catch (eTorch) {}
          state.liveStatusText = 'Kamera aktif — menyiapkan pengenalan wajah...';
          render();

          var liveVideo = document.getElementById('face-video');
          if (liveVideo) {
            liveVideo.setAttribute('playsinline', 'true');
            liveVideo.setAttribute('webkit-playsinline', 'true');
            liveVideo.setAttribute('autoplay', 'true');
            liveVideo.muted = true;
            liveVideo.srcObject = stream;
            liveVideo.play().catch(function () {});
          }

          startGasLightingMonitor();

          return loadGasFaceModels().then(function () {
            if (!faceStream) return;
            state.liveStatusText = 'Kamera aktif — mendeteksi wajah...';
            var statusEl = document.getElementById('face-live-status');
            if (statusEl) statusEl.textContent = state.liveStatusText;
            scheduleGasFaceFrame();
          }).catch(function (modelErr) {
            if (!faceStream) return;
            state.liveStatusText = 'Kamera aktif (gagal muat model otomatis — gunakan Kamera Foto HP / Input NIS)';
            var statusEl = document.getElementById('face-live-status');
            if (statusEl) statusEl.textContent = state.liveStatusText;
            refreshScannerDynamicPanels();
            console.warn(modelErr);
          });
        }).catch(function (err) {
          stopCameraScanner(true);
          var errMsg = err && err.message ? err.message : String(err || 'Permission denied');
          var inIframe = false;
          try { inIframe = window.self !== window.top; } catch (e) { inIframe = true; }
          var permDenied = isGasCameraPermissionError(err);

          var finalizeError = function (isDenied) {
            state.cameraPermissionDenied = isDenied;
            state.cameraError = inIframe
              ? 'Kamera langsung dibatasi pada tampilan iframe / pratinjau Google Apps Script (' + errMsg + '). Gunakan tombol "Kamera Foto HP" di bawah atau buka link Web App langsung di Chrome / Safari.'
              : isDenied
              ? 'Izin kamera langsung ditolak browser (' + errMsg + '). Anda tetap dapat langsung absen dengan tombol "Kamera Foto HP" di bawah, atau aktifkan kembali izin Kamera di pengaturan browser HP.'
              : 'Kamera langsung gagal dibuka (' + errMsg + '). Pastikan izin Kamera diaktifkan atau gunakan tombol "Kamera Foto HP" di bawah.';
            render();
          };

          if (!permDenied && typeof navigator !== 'undefined' && navigator.permissions && navigator.permissions.query) {
            navigator.permissions.query({ name: 'camera' }).then(function (status) {
              finalizeError(status && status.state === 'denied');
            }).catch(function () {
              finalizeError(false);
            });
          } else {
            finalizeError(permDenied);
          }
        });
      }

      function stopCameraScanner(skipRender) {
        if (faceDetectTimer) { clearTimeout(faceDetectTimer); faceDetectTimer = null; }
        if (lightingMonitorTimer) { clearInterval(lightingMonitorTimer); lightingMonitorTimer = null; }
        if (faceStream) {
          try { faceStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
          faceStream = null;
        }
        var v = document.getElementById('face-video');
        if (v) v.srcObject = null;
        state.cameraActive = false;
        state.hasTorch = false;
        state.isTorchOn = false;
        state.lightingQuality = null;
        state.liveStatusText = 'Kamera dimatikan';
        if (!skipRender) render();
      }

      function toggleCameraFacing() {
        var next = state.cameraFacing === 'user' ? 'environment' : 'user';
        state.cameraFacing = next;
        if (state.cameraActive) startCameraScanner(next);
        else render();
      }

      function toggleCameraTorch() {
        if (!faceStream || !state.cameraActive || !state.hasTorch) return;
        try {
          var track = faceStream.getVideoTracks()[0];
          var next = !state.isTorchOn;
          track.applyConstraints({ advanced: [{ torch: next }] });
          state.isTorchOn = next;
          render();
        } catch (e) {}
      }

      function captureCameraSnapshot() {
        var video = document.getElementById('face-video');
        if (!video || !state.cameraActive || video.readyState < 2 || video.videoWidth === 0) return;
        var frameCanvas = captureGasVideoFrameCanvas(video);
        var scanSource = frameCanvas || video;
        var frameLighting = analyzeGasFrameLighting(scanSource) || state.lightingQuality;
        state.isProcessingPhoto = true;
        state.scannerMessage = '';
        var snapBtn = document.getElementById('scanner-snapshot-btn');
        if (snapBtn) snapBtn.textContent = 'Mendeteksi wajah...';
        detectGasSingleFace(scanSource).then(function (detected) {
          state.isProcessingPhoto = false;
          if (snapBtn) snapBtn.textContent = 'Jepret & Cocokkan';
          handleGasDetectedFace(detected, frameLighting);
        }).catch(function (err) {
          state.isProcessingPhoto = false;
          if (snapBtn) snapBtn.textContent = 'Jepret & Cocokkan';
          AudioFX.error();
          state.scannerMessage = 'Gagal memproses foto wajah: ' + (err && err.message ? err.message : err);
          refreshScannerDynamicPanels();
        });
      }

      function handleSmartphonePhotoScan(e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        state.cameraError = '';
        state.scannerMessage = '';
        state.isProcessingPhoto = true;
        if (state.cameraActive) stopCameraScanner(true);
        render();

        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function () {
          URL.revokeObjectURL(url);
          var photoLighting = analyzeGasFrameLighting(img);
          detectGasSingleFace(img).then(function (detected) {
            state.isProcessingPhoto = false;
            handleGasDetectedFace(detected, photoLighting);
          }).catch(function (err) {
            state.isProcessingPhoto = false;
            AudioFX.error();
            state.scannerMessage = 'Foto wajah tidak dapat diproses (' + (err && err.message ? err.message : err) + '). Pastikan wajah jelas menghadap kamera.';
            render();
          });
        };
        img.onerror = function () {
          URL.revokeObjectURL(url);
          state.isProcessingPhoto = false;
          AudioFX.error();
          state.scannerMessage = 'Berkas gambar tidak dapat dibaca.';
          render();
        };
        img.src = url;
        e.target.value = '';
      }

      function buildScannerAlertsHtml() {
        var openTabLink = (state.cameraError && state.webAppUrl)

      function refreshScannerDynamicPanels() {

        var lastEl = document.getElementById('scanner-last-wrap');
        var enrollEl = document.getElementById('scanner-enroll-wrap');
        var alertsEl = document.getElementById('scanner-alerts-wrap');
        var cardsEl = document.getElementById('scanner-cards-wrap');
        var countBadgeEl = document.getElementById('scanner-face-count-badge');
        if (!lastEl || !cardsEl) { render(); return; }
        lastEl.innerHTML = buildScannerLastHtml();
        if (enrollEl) enrollEl.innerHTML = buildScannerEnrollHtml();
        if (alertsEl) alertsEl.innerHTML = buildScannerAlertsHtml();
        cardsEl.innerHTML = buildScannerQuickCardsHtml();
        if (countBadgeEl) {
          var enrolledCount = state.students.filter(function (s) {
            return Array.isArray(s.faceDescriptor) && s.faceDescriptor.length === 128;
          }).length;
          countBadgeEl.textContent = enrolledCount + '/' + state.students.length + ' Wajah';
        }
        safeCreateIcons();

          { id: 'schedules', label: 'Jadwal Pelajaran (' + state.schedules.length + ')' },

        }).join('');

        var body = '';

                  return (
                    '<div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs space-y-2">' +
                      '<div class="flex items-center justify-between">' +

      function buildStudentTableRowsHtml() {
        var q = state.studentSearch.toLowerCase();
        var filtered = state.students.filter(function (s) {
          var matchC = state.studentClassFilter === 'all' || s.studentClass === state.studentClassFilter;
          var matchQ = !q || s.name.toLowerCase().indexOf(q) !== -1 || String(s.nis || '').indexOf(q) !== -1;
          return matchC && matchQ;
        });
        return filtered.map(function (s) {
          var hasFace = Array.isArray(s.faceDescriptor) && s.faceDescriptor.length === 128;
          var photoHtml = s.facePhoto
            ? '<img src="' + esc(s.facePhoto) + '" alt="' + esc(s.name) + '" class="w-9 h-9 rounded-lg object-cover border border-slate-200 shrink-0" />'
            : '<div class="w-9 h-9 rounded-lg bg-slate-100 text-slate-600 font-bold text-xs flex items-center justify-center shrink-0">' + esc((s.name || 'S').slice(0, 2).toUpperCase()) + '</div>';
          return (
            '<tr class="hover:bg-slate-50 text-xs">' +
              '<td class="py-3 px-4 font-mono text-slate-700">' + esc(s.nis) + '<div class="text-[10px] text-slate-400">NISN: ' + esc(s.nisn) + '</div></td>' +
              '<td class="py-3 px-4"><div class="flex items-center gap-2.5">' + photoHtml + '<span class="font-semibold text-slate-900">' + esc(s.name) + '</span></div></td>' +
              '<td class="py-3 px-4"><span class="px-2 py-0.5 rounded bg-slate-100 text-slate-700 font-semibold text-[11px]">' + esc(s.studentClass) + '</span></td>' +
              '<td class="py-3 px-4"><button onclick="openEntityModal(\'student\',\'' + esc(escJs(s.id)) + '\')" class="px-2 py-0.5 rounded-full text-[10px] font-bold ' + (hasFace ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800') + '">' + (hasFace ? 'Wajah Siap' : '+ Daftar Wajah') + '</button></td>' +
              '<td class="py-3 px-4 text-slate-600">' + esc(s.parentName) + '<div class="text-[10px] font-mono text-slate-400">+' + esc(s.parentPhone) + '</div></td>' +

      function sendWABlastAndLog(studentId, msgTypeLabel, encodedMsg) {
        var st = state.students.find(function (x) { return x.id === studentId; });
        if (!st) return;
        var decodedMsg = '';
        try { decodedMsg = decodeURIComponent(encodedMsg); } catch (e) { decodedMsg = ''; }
        var logObj = {
          id: 'log-' + Date.now() + '-' + st.id,
          timestamp: todayISO() + ' ' + formatTimeNow(),
          studentName: st.name,
          studentClass: st.studentClass,
          parentName: st.parentName,
          recipientPhone: st.parentPhone,
          messageType: msgTypeLabel,
          content: decodedMsg,
          status: 'terkirim'
        };
        state.logs.unshift(logObj);
        if (IS_GAS) {
          gasCall('addNotificationLog', logObj).then(function (logs) {
            if (Array.isArray(logs)) state.logs = logs;
            render();
          }).catch(function () {});
        }
      }

          return !presentIds.has(s.id) && (state.waBlastClass === 'all' || s.studentClass === state.waBlastClass);

      function handleSettingsLogoFile(e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        syncSettingsFormToState();
        var reader = new FileReader();
        reader.onload = function (ev) {
          var dataUrl = ev.target.result;
          // Kosongkan faviconUrl Drive lama agar saat disimpan dibuatkan ikon Drive baru
          if (state.settings.faviconUrl && (state.settings.faviconUrl.indexOf('drive.google.com/') !== -1 || state.settings.faviconUrl.indexOf('googleusercontent.com/') !== -1)) {
            state.settings.faviconUrl = '';
          }
          state.faviconSavedNotice = false;
          if (file.type === 'image/svg+xml') {
            state.settings.schoolLogo = dataUrl;
            renderFaviconPngFromLogo(dataUrl, function (pngUrl) {
              state.settings.faviconDataUrl = pngUrl || '';
              syncFavicon(dataUrl);
              render();
            });
            return;
          }
          var img = new Image();
          img.onload = function () {
            var max = 256;
            var w = img.width, h = img.height;
            if (w > max || h > max) {
              var r = Math.min(max / w, max / h);
              w = Math.round(w * r); h = Math.round(h * r);
            }
            var c = document.createElement('canvas');
            c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            state.settings.schoolLogo = c.toDataURL('image/png', 0.9);
            renderFaviconPngFromLogo(state.settings.schoolLogo, function (pngUrl) {
              state.settings.faviconDataUrl = pngUrl || state.settings.schoolLogo;
              syncFavicon(state.settings.schoolLogo);
              render();
            });
          };
          img.src = dataUrl;
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      }

        e.preventDefault();
        syncSettingsFormToState();
        if (state.settings.faviconUrl) {

      function exportJsonBackup() {
        var payload = JSON.stringify({
          students: state.students, records: state.records, settings: state.settings,
          classes: state.classes, subjects: state.subjects, teachers: state.teachers,
          schedules: state.schedules, templates: state.templates, logs: state.logs,
          registeredUsers: state.registeredUsers || []
        }, null, 2);
        var blob = new Blob([payload], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'sas_spreadsheet_backup_' + todayISO() + '.json';
        a.click();
      }

      function importJsonBackupFile(e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (ev) {
          var raw = ev.target.result;
          try {
            var parsed = JSON.parse(raw);
            if (!parsed || (!Array.isArray(parsed.students) && !parsed.settings)) {
              showToast('Format file backup JSON tidak valid.', 'error');
              return;
            }
            if (IS_GAS) {
              state.loading = true;
              render();
              gasCall('importBackupJson', raw).then(function (data) {
                applyBootstrapData(data);
                state.loading = false;
                showToast('Backup JSON berhasil dipulihkan ke Google Spreadsheet!');
                render();
              }).catch(function (err) {
                state.loading = false;
                showToast('Gagal mengimpor backup: ' + err.message, 'error');
                render();
              });
            } else {
              applyBootstrapData(Object.assign(getFallbackDemoData(), parsed));
              showToast('Backup JSON dipulihkan (mode pratinjau lokal).');
              render();
            }
          } catch (err) {
            showToast('File JSON rusak atau tidak dapat dibaca.', 'error');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      }
