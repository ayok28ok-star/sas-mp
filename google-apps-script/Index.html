      function startStudentModalCamera() {
        var statusEl = document.getElementById('modal-face-status');
        var box = document.getElementById('modal-face-cam-wrap');
        var v = document.getElementById('modal-face-video');
        var showCameraFail = function (msg) {
          var inIframe = false;
          try { inIframe = window.self !== window.top; } catch (e) { inIframe = true; }
          var fullUrl = state.webAppUrl || (typeof window !== 'undefined' ? window.location.href : '');
          var tabLink = (inIframe && fullUrl)
            ? '<div class="mt-1.5"><a href="' + esc(fullUrl) + '" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 px-2.5 py-1 bg-rose-600 text-white text-[10px] font-bold rounded-md">Buka Tab Penuh untuk Kamera Langsung</a></div>'
            : '';
          if (statusEl) {
            statusEl.innerHTML = '<div class="text-rose-600">' +
              (inIframe
                ? 'Kamera langsung dibatasi pada tampilan iframe / pratinjau. Silakan gunakan tombol <strong>"Foto Kamera HP"</strong> atau <strong>"Unggah Foto Wajah"</strong> di atas.'
                : 'Kamera langsung tidak tersedia (' + esc(msg) + '). Silakan gunakan tombol <strong>"Foto Kamera HP"</strong> atau <strong>"Unggah Foto Wajah"</strong> di atas.') +
              tabLink +
            '</div>';
          }
        };

        if (typeof navigator === 'undefined' || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showCameraFail('getUserMedia tidak didukung');
          return;
        }
        stopStudentModalCamera(true);
        if (statusEl) statusEl.textContent = 'Membuka kamera perangkat...';

        navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'user' }, width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false })
          .catch(function () { return navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false }); })
          .catch(function () { return navigator.mediaDevices.getUserMedia({ video: true, audio: false }); })
          .then(function (stream) {
            studentModalStream = stream;
            if (box) box.classList.remove('hidden');
            if (v) {
              v.setAttribute('playsinline', 'true');
              v.setAttribute('webkit-playsinline', 'true');
              v.setAttribute('autoplay', 'true');
              v.muted = true;
              v.srcObject = stream;
              v.play().catch(function () {});
            }
            if (statusEl) statusEl.textContent = 'Kamera aktif — arahkan wajah siswa lalu klik "Ambil Wajah".';
            loadGasFaceModels().catch(function () {});
          }).catch(function (err) {
            showCameraFail(err && err.message ? err.message : 'Izin kamera ditolak');
          });
      }

      function captureStudentModalFace() {
        var v = document.getElementById('modal-face-video');
        var statusEl = document.getElementById('modal-face-status');
        if (!v || v.readyState < 2 || v.videoWidth === 0) return;
        var frameCanvas = captureGasVideoFrameCanvas(v);
        var source = frameCanvas || v;
        var lighting = analyzeGasFrameLighting(source);
        if (statusEl) statusEl.textContent = 'Mengekstrak fitur wajah...';
        detectGasSingleFace(source).then(function (detected) {
          if (!detected) {
            var reason = (lighting && lighting.level === 'dark')
              ? 'Wajah tidak terdeteksi karena pencahayaan terlalu gelap (' + lighting.scorePct + '%). Pindah ke tempat lebih terang lalu coba lagi.'
              : (lighting && lighting.level === 'bright')
              ? 'Wajah tidak terdeteksi karena cahaya terlalu silau (' + lighting.scorePct + '%). Hindari sorotan lampu langsung.'
              : 'Wajah tidak terdeteksi. Hadapkan wajah ke kamera dengan cahaya cukup dan coba lagi.';
            if (statusEl) statusEl.innerHTML = '<span class="text-amber-700 font-semibold">' + esc(reason) + '</span>';
            return;
          }
          state.studentFormFace = { facePhoto: detected.facePhoto, descriptor: detected.descriptor };
          var prev = document.getElementById('modal-face-preview');
          if (prev) prev.innerHTML = '<img src="' + esc(detected.facePhoto) + '" class="w-16 h-16 rounded-xl object-cover border-2 border-emerald-400" />';
          stopStudentModalCamera();
          if (statusEl) statusEl.innerHTML = '<span class="text-emerald-700 font-bold">Foto wajah &amp; biometrik (128 fitur) berhasil diambil! Klik Simpan ke Sheet.</span>';
        }).catch(function (err) {
          if (statusEl) statusEl.innerHTML = '<span class="text-rose-600">Gagal mendeteksi wajah: ' + esc(err && err.message ? err.message : err) + '</span>';
        });
      }

      function handleStudentModalPhoto(e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        var statusEl = document.getElementById('modal-face-status');
        if (statusEl) statusEl.textContent = 'Mendeteksi wajah pada foto...';
        stopStudentModalCamera();
        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function () {
          URL.revokeObjectURL(url);
          var lighting = analyzeGasFrameLighting(img);
          detectGasSingleFace(img).then(function (detected) {
            if (!detected) {
              var reason = (lighting && lighting.level === 'dark')
                ? 'Wajah tidak terdeteksi karena foto terlalu gelap (' + lighting.scorePct + '%). Ambil foto di tempat lebih terang.'
                : (lighting && lighting.level === 'bright')
                ? 'Wajah tidak terdeteksi karena foto terlalu silau (' + lighting.scorePct + '%). Hindari cahaya menyilaukan.'
                : 'Wajah tidak terdeteksi pada foto. Pilih foto wajah depan yang jelas dan terang.';
              if (statusEl) statusEl.innerHTML = '<span class="text-rose-600 font-semibold">' + esc(reason) + '</span>';
              return;
            }
            state.studentFormFace = { facePhoto: detected.facePhoto, descriptor: detected.descriptor };
            var prev = document.getElementById('modal-face-preview');
            if (prev) prev.innerHTML = '<img src="' + esc(detected.facePhoto) + '" class="w-16 h-16 rounded-xl object-cover border-2 border-emerald-400" />';
            if (statusEl) statusEl.innerHTML = '<span class="text-emerald-700 font-bold">Wajah terverifikasi &amp; siap disimpan ke Sheet Siswa!</span>';
          }).catch(function (err) {
            if (statusEl) statusEl.innerHTML = '<span class="text-rose-600">Gagal memproses foto: ' + esc(err && err.message ? err.message : err) + '</span>';
          });
        };
        img.onerror = function () {
          URL.revokeObjectURL(url);
          if (statusEl) statusEl.innerHTML = '<span class="text-rose-600">Berkas gambar tidak valid.</span>';
        };
        img.src = url;
        e.target.value = '';
      }

      function render() {
        var app = document.getElementById('app');
        if (!app) return;

        var activeEl = document.activeElement;
        var focusId = activeEl && activeEl.id ? activeEl.id : '';
        var focusSelStart = activeEl && typeof activeEl.selectionStart === 'number' ? activeEl.selectionStart : null;
        var focusSelEnd = activeEl && typeof activeEl.selectionEnd === 'number' ? activeEl.selectionEnd : null;

        if (state.loading) {
          app.innerHTML =
            '<div class="min-h-screen bg-slate-50 flex items-center justify-center">' +
              '<div class="text-center space-y-2">' +
                '<div class="w-10 h-10 border-4 border-emerald-600 border-t-transparent rounded-full animate-spin mx-auto"></div>' +
                '<p class="text-xs font-semibold text-slate-600">Menghubungkan ke Google Spreadsheet SAS...</p>' +
              '</div>' +
            '</div>';
          return;
        }

        if (!state.authUser) {
          app.innerHTML = renderLoginView();
          safeCreateIcons();
          return;
        }

        var mainHtml = '';
        if (state.currentTab === 'dashboard') mainHtml = renderDashboard();
        else if (state.currentTab === 'scanner') mainHtml = renderScanner();
        else if (state.currentTab === 'schedule') mainHtml = renderScheduleManager();
        else if (state.currentTab === 'students') mainHtml = renderStudentManager();
        else if (state.currentTab === 'progress') mainHtml = renderProgressReport();
        else if (state.currentTab === 'reports') mainHtml = renderAttendanceReport();
        else if (state.currentTab === 'whatsapp') mainHtml = renderWhatsAppManager();
        else if (state.currentTab === 'settings') mainHtml = renderSettingsView();

        app.innerHTML =
          '<div class="min-h-screen bg-slate-50 text-slate-900 flex flex-col">' +
            renderNavbar() +
            (state.bootstrapError
              ? '<div class="no-print bg-amber-50 border-b border-amber-200 px-4 py-2.5 text-xs text-amber-900 flex flex-wrap items-center justify-between gap-2">' +
                  '<span><strong>Peringatan Koneksi Spreadsheet:</strong> ' + esc(state.bootstrapError) + '</span>' +
                  '<button type="button" onclick="bootstrapApp()" class="px-3 py-1 bg-amber-600 text-white font-semibold rounded-lg">Muat Ulang</button>' +
                '</div>'
              : '') +
            '<div class="flex-1 flex relative">' +
              renderRightSidebar() +
              '<main class="flex-1 min-w-0 max-w-7xl w-full mx-auto p-4 sm:p-6 pb-16">' + mainHtml + '</main>' +
            '</div>' +

                  '<span class="h-2 w-2 rounded-full bg-white animate-pulse"></span><span>Mode Offline — Koneksi internet terputus</span>' +
                '</div>'
              : '') +
          '</div>';

        safeCreateIcons();
        if (focusId && (focusId === 'scanner-search-input' || focusId === 'student-search-input' || focusId === 'report-search-input')) {
          var restored = document.getElementById(focusId);
          if (restored) {
            try {
              restored.focus();
              if (focusSelStart !== null && focusSelEnd !== null && restored.setSelectionRange) {
                restored.setSelectionRange(focusSelStart, focusSelEnd);
              }
            } catch (e) {}
          }
        }
        if (state.currentTab === 'dashboard') {
          setTimeout(initDashboardChart, 20);
        } else if (state.currentTab === 'scanner' && state.cameraActive && faceStream) {
          var liveVideo = document.getElementById('face-video');

            liveVideo.muted = true;
            liveVideo.srcObject = faceStream;
            liveVideo.play().catch(function () {});
          }
          refreshGasLightingHud();
        }
      }

      function buildGasAutoInstallUrl() {
        var base = state.webAppUrl || (typeof window !== 'undefined' ? window.location.href : '');
        if (!base) return '';
        if (base.indexOf('sas_install=1') !== -1) return base;
        var sep = base.indexOf('?') === -1 ? '?' : '&';
        return base + sep + 'sas_install=1';
      }

      function downloadGasLauncherFile() {
        var s = state.settings || {};
        var targetUrl = state.webAppUrl || (typeof window !== 'undefined' ? window.location.href : '');
        if (!targetUrl) {
          showToast('URL Web App belum tersedia.', 'error');
          return;
        }
        var sep = targetUrl.indexOf('?') === -1 ? '?' : '&';
        var launchTarget = targetUrl.indexOf('sas_install=1') !== -1 ? targetUrl : targetUrl + sep + 'sas_install=1';
        var schoolTitle = esc(s.schoolName || 'SMP Negeri');

          '<!doctype html><html lang="id"><head><meta charset="UTF-8" />' +

          '<script>window.location.replace(' + JSON.stringify(launchTarget) + ');<\/script>' +

          '<a class="btn" href="' + esc(launchTarget) + '">Buka &amp; Instal Aplikasi SAS</a>' +
          '</div></body></html>';

        var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = 'SAS-Absensi-Launcher.html';

                      '<span class="px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-bold">Ikon Resmi HP &amp; Desktop</span>' +
                      '<span class="px-2 py-0.5 rounded bg-slate-100 text-slate-700 text-[10px] font-semibold">Gratis</span>' +
                    '</div>' +
                  '</div>' +
                '</div>' +
                '<div class="grid grid-cols-3 divide-x divide-slate-200 py-3 rounded-2xl bg-slate-50 border border-slate-200 text-center text-xs">' +
                  '<div><p class="font-extrabold text-slate-900">4.9 &#9733;</p><p class="text-[10px] text-slate-500">Resmi Sekolah</p></div>' +
                  '<div><p class="font-extrabold text-slate-900">Ringan</p><p class="text-[10px] text-slate-500">HP &amp; PC</p></div>' +
                  '<div><p class="font-extrabold text-slate-900">Layar Utama</p><p class="text-[10px] text-slate-500">Ikon Otomatis</p></div>' +
                '</div>' +
                actionHtml +
              '</div>' +
            '</div>' +
          '</div>',
          false
        );
      }

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__sasDeferredPrompt = e;
        state.deferredInstallPrompt = e;
        render();
      });
      window.addEventListener('appinstalled', function () {
        state.isInstalledStandalone = true;
        state.deferredInstallPrompt = null;
        window.__sasDeferredPrompt = null;
        window.__sasPwaInstalled = true;
        render();
      });
      window.addEventListener('online', function () { state.isOnline = true; render(); });
      window.addEventListener('offline', function () { state.isOnline = false; render(); });

      window.addEventListener('DOMContentLoaded', bootstrapApp);
    </script>
  </body>
</html>
